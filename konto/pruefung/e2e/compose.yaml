# Testumgebung für die Anmeldung über das gemeinsame Konto (E4.2, Schritt 4):
# ZITADEL in derselben Version wie auf konto.lernpfade.net und die eigene
# Anmelde-App aus konto/login. NUR für die CI-Strecke und lokale Prüfungen:
# fester Test-Masterkey, kein TLS, ZITADEL darf den Docker-Host erreichen.
# Gestartet wird über starte.sh, nicht direkt.
name: konto-e2e

services:
  konto-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zitadel -d zitadel']
      interval: 2s
      timeout: 3s
      retries: 30

  konto:
    image: ghcr.io/zitadel/zitadel:v4.20.5@sha256:cb21fe73badfe44972bb24a66cf0ebce6a8dc63ab8ed24567af6b731bd8bbf45
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: e2e-masterkey-nur-fuer-tests-000
      ZITADEL_DATABASE_POSTGRES_HOST: konto-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: 'false'
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: 'true'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:3000/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:3000/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:3000/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:3000/ui/v2/login/login?samlRequest=
      ZITADEL_SYSTEMAPIUSERS: ${KONTO_E2E_SYSTEMAPIUSERS:-}
      # Nur hier: Die Rückkanal-Abmeldung geht an die App auf dem Docker-Host.
      ZITADEL_HTTPCLIENT_DENYLIST: 0.0.0.0/8,169.254.0.0/16
    ports:
      - '8080:8080'
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 10s
    depends_on:
      konto-db:
        condition: service_healthy

  konto-login:
    image: ${KONTO_LOGIN_IMAGE:-lernpfade/konto-login:e2e}
    # Teilt das Netz mit ZITADEL: localhost:8080 ist dort die API.
    network_mode: service:konto
    environment:
      ZITADEL_API_URL: http://localhost:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      EMAIL_VERIFICATION: 'true'
    env_file:
      - path: ${KONTO_E2E_DIR:-.}/login.env
        required: false
    depends_on:
      konto:
        condition: service_healthy
