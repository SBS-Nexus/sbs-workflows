name: TEMP PythonPfad issue51 upstream fix validation
on:
  push:
    branches: [codex/diagnose-python-invitation-51]
    paths: ['.github/workflows/temp-python-invitation-51.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pythonpfad
          POSTGRES_PASSWORD: pythonpfad
          POSTGRES_DB: pythonpfad
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pythonpfad -d pythonpfad"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: pythonpfad
    env:
      DATABASE_URL: postgresql://pythonpfad:pythonpfad@127.0.0.1:5432/pythonpfad?schema=public
      AUTH_SECRET: ci-lauf-geheimnis-ohne-jede-bedeutung-0123456789
      APP_URL: http://127.0.0.1:3100
      SEED_DEMO_USERS: 'false'
      E2E_PORT: '3100'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d88a538a6bf04519f4a2eae7e161ea749190bfa
          fetch-depth: 20
      - name: Verify candidate source
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "8d88a538a6bf04519f4a2eae7e161ea749190bfa"
          git diff --check 847984718445c7ff13f9a286b4ae55858c67ff88 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pythonpfad/package-lock.json
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - name: Check formatting, lint and types
        run: |
          npx prettier --check package.json package-lock.json e2e/organisation.spec.ts
          npm run lint
          npm run typecheck
      - name: Unit and integration tests
        env:
          TEST_DATABASE_URL: postgresql://pythonpfad:pythonpfad@127.0.0.1:5432/pythonpfad_test?schema=public
        run: |
          PGPASSWORD=pythonpfad psql -h 127.0.0.1 -U pythonpfad -d pythonpfad -c 'CREATE DATABASE pythonpfad_test OWNER pythonpfad;'
          npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Add runner-only browser and database observations
        run: |
          node --input-type=module <<'DIAGNOSTICS'
          import fs from 'node:fs';
          const path = 'e2e/organisation.spec.ts';
          fs.appendFileSync(path, "\nimport { Client } from 'pg';\nimport { writeFile } from 'node:fs/promises';\n\nconst invitationDiagnostics = new WeakMap<object, { posts: Array<Record<string, unknown>>; consoleErrors: string[]; pageErrors: string[] }>();\n\ntest.beforeEach(async ({ page }) => {\n  const evidence = { posts: [] as Array<Record<string, unknown>>, consoleErrors: [] as string[], pageErrors: [] as string[] };\n  invitationDiagnostics.set(page, evidence);\n  page.on('console', (message) => {\n    if (message.type() === 'error') evidence.consoleErrors.push(message.text().slice(0,500));\n  });\n  page.on('pageerror', (error) => evidence.pageErrors.push(error.message.slice(0,500)));\n  page.on('response', (response) => {\n    const request = response.request();\n    if (request.method() !== 'POST' || !new URL(response.url()).pathname.startsWith('/organisation')) return;\n    const record: Record<string, unknown> = {\n      path: new URL(response.url()).pathname,\n      status: response.status(),\n      at: Date.now(),\n      complete: false,\n    };\n    evidence.posts.push(record);\n    void response.text().then((body) => {\n      Object.assign(record, {\n        complete: true,\n        completedAt: Date.now(),\n        bytes: Buffer.byteLength(body),\n        hasInvitationResult: body.includes('invitationUrl'),\n        hasCreatedCohortResult: body.includes('Kohorte') && body.includes('angelegt'),\n      });\n    }).catch((error: unknown) => {\n      record.bodyReadError = error instanceof Error ? error.message.slice(0,300) : 'unknown';\n    });\n  });\n});\n\ntest.afterEach(async ({ page }, testInfo) => {\n  const evidence: Record<string, unknown> = invitationDiagnostics.get(page) ?? {};\n  evidence.testStatus = testInfo.status;\n  evidence.urlPath = new URL(page.url()).pathname;\n  evidence.title = await page.title().catch(() => 'unavailable');\n  evidence.ui = await page.locator('main').innerText().then(text => ({\n    nonempty: text.trim().length > 0,\n    pendingInvitation: text.includes('Wird erstellt'),\n    pendingCohort: text.includes('Wird angelegt'),\n    visibleInvitation: text.includes('/einladung/'),\n    hasFrameworkError: /Application error|Internal Server Error/.test(text),\n  })).catch(() => null);\n  evidence.resources = await page.evaluate(() => performance.getEntriesByType('resource')\n    .filter((entry) => new URL(entry.name).pathname.startsWith('/organisation/'))\n    .map((entry) => {\n      const resource = entry as PerformanceResourceTiming;\n      return { path: new URL(entry.name).pathname, startTime: resource.startTime,\n        duration: resource.duration, responseEnd: resource.responseEnd, decodedBodySize: resource.decodedBodySize };\n    }));\n  const slug = new URL(page.url()).pathname.split('/')[2];\n  if (slug) {\n    const client = new Client({ connectionString: process.env.DATABASE_URL });\n    try {\n      await client.connect();\n      const result = await client.query(\n        'SELECT (SELECT count(*)::int FROM invitations i WHERE i.\"organizationId\" = o.id) AS invitations, (SELECT count(*)::int FROM audit_entries a WHERE a.\"organizationId\" = o.id AND a.action = \\'invitation.created\\') AS invitation_audits, (SELECT count(*)::int FROM cohorts c WHERE c.\"organizationId\" = o.id) AS cohorts FROM organizations o WHERE o.slug = $1', [slug],\n      );\n      evidence.database = result.rows;\n    } catch (error) {\n      evidence.databaseReadError = error instanceof Error ? error.message : 'unknown';\n    } finally { await client.end(); }\n  }\n  await writeFile(testInfo.outputPath('invitation-diagnostics.json'), JSON.stringify(evidence,null,2));\n  console.log('[issue51-diagnostics]', JSON.stringify(evidence));\n  await page.screenshot({ path: testInfo.outputPath('final-ui.png'), fullPage: false }).catch(() => {});\n});\n");
          DIAGNOSTICS
          node --experimental-strip-types --check e2e/organisation.spec.ts
      - name: Repeat invitation flow with diagnostics and no retries
        run: |
          set -o pipefail
          npm run test:e2e -- e2e/organisation.spec.ts --project=desktop-chromium --grep 'legt eine Organisation an' --repeat-each=20 --max-failures=3 --retries=0 --workers=1 --reporter=list --output=/tmp/issue51-results 2>&1 | tee /tmp/issue51-e2e.log
      - name: Complete Python E2E suite without retries
        run: |
          set -o pipefail
          npm run test:e2e -- --retries=0 --reporter=list --output=/tmp/issue51-full-results 2>&1 | tee /tmp/issue51-full-e2e.log
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue51-upstream-8d88a53
          path: |
            /tmp/issue51-results/
            /tmp/issue51-e2e.log
            /tmp/issue51-full-results/
            /tmp/issue51-full-e2e.log
          retention-days: 7
