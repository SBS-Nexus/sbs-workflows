name: TEMP PythonPfad invitation issue51 diagnosis
on:
  push:
    branches: [codex/diagnose-python-invitation-51]
    paths: ['.github/workflows/temp-python-invitation-51.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pythonpfad
          POSTGRES_PASSWORD: pythonpfad
          POSTGRES_DB: pythonpfad
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pythonpfad -d pythonpfad"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: pythonpfad
    env:
      DATABASE_URL: postgresql://pythonpfad:pythonpfad@127.0.0.1:5432/pythonpfad?schema=public
      AUTH_SECRET: ci-lauf-geheimnis-ohne-jede-bedeutung-0123456789
      APP_URL: http://127.0.0.1:3100
      SEED_DEMO_USERS: 'false'
      E2E_PORT: '3100'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 847984718445c7ff13f9a286b4ae55858c67ff88
      - name: Verify baseline source
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "847984718445c7ff13f9a286b4ae55858c67ff88"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pythonpfad/package-lock.json
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Repeat unchanged invitation flow 10 times without retries
        run: |
          set -o pipefail
          npm run test:e2e -- e2e/organisation.spec.ts --project=desktop-chromium --grep 'legt eine Organisation an' --repeat-each=10 --retries=0 --workers=1 --reporter=list --output=/tmp/issue51-results 2>&1 | tee /tmp/issue51-e2e.log
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue51-baseline-8479847
          path: |
            /tmp/issue51-results/
            /tmp/issue51-e2e.log
          retention-days: 7
