name: TEMP AIPfad format probe

on:
  push:
    branches:
      - claude/lernpfade-unified-hub
    paths:
      - 'aipfad/src/components/app/app-header.tsx'
      - '.github/workflows/temp-aipfad-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aipfad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aipfad/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Print canonical formatting
        run: |
          echo 'PRETTIER_BASE64_BEGIN'
          npx prettier src/components/app/app-header.tsx | base64 -w0
          echo
          echo 'PRETTIER_BASE64_END'
