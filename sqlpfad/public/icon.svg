<!--
  Bildzeichen von SQLPfad: drei Knoten, durch Kanten verbunden.

  Es zeigt keine Datenbanktrommel. Die Trommel ist das Klischee für „Datenbank",
  aber sie zeigt den Behälter; worum es hier geht, ist die Beziehung zwischen
  Tabellen – der JOIN. Genau das ist die Hürde, an der Lernende hängenbleiben.
-->
